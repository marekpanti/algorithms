<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling Example</title>
    <style>
        #grandparent {
            background-color: lightcoral;
            padding: 20px;
        }
        #parent {
            background-color: lightblue;
            padding: 20px;
        }
        #child {
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>
<body>

<div id="grandparent">
    <h1>Grandparent - only one event listener with event.explicitOriginalTarget().id</h1>
    <div id="parent">
        Parent
        <div id="child">
            Child
        </div>
    </div>
</div>

<script>
    document.getElementById('grandparent').addEventListener('click', function(event) {
        console.log('Grandparent clicked!');
        console.log('target: ', event.target.getAttribute("id"));
        // if (event.target.getAttribute("id") === 'child') {
        //     //
        // }
    });

    document.getElementById('parent').addEventListener('click', function(event) {
        console.log('Parent clicked!');
        // event.stopPropagation();
    });

    document.getElementById('child').addEventListener('click', function(event) {
        console.log('Child clicked!');
        // event.stopPropagation();
    });
</script>

</body>
</html>
